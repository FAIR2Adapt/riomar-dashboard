name: Deploy Lesprojekt

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-lesprojekt:
    runs-on: [self-hosted, ai-s]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Publish
        run: |
          rsync -a --delete \
            dist/ \
            /opt/fair2adapt-app/
